name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check committed action bundle
        run: |
          git ls-files --error-unmatch .action/runtime.js
          git diff --exit-code -- .action/runtime.js
      - run: npm test
      - name: Smoke test the action entry point
        run: node scripts/action.mjs
        env:
          INPUT_DATA_FILE: data/sample.json
          INPUT_OUTPUT_DIR: dist/action-smoke
          INPUT_SEED: '1'
          INPUT_INITIAL_BALLS: '5'
          GITHUB_OUTPUT: ${{ runner.temp }}/contribution-party-action-output
