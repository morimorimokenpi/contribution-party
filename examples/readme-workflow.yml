name: Update contribution party

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-party-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # data/contributions.jsonは利用者が用意し、更新します。必要なら、この前に取得用stepを追加してください。
      - name: Generate both SVG themes
        uses: morimorimokenpi/contribution-party@main
        with:
          data_file: data/contributions.json
          output_dir: contribution-party-output
          seed: '1'
          initial_balls: '1'

      - name: Save images to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: contribution-party-output
          build_dir: contribution-party-output
          keep_history: true
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
